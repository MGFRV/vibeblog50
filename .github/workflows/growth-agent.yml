name: Growth agent

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: 'Конкретное поручение агенту (необязательно — если пусто, решает сам)'
        required: false
        default: ''
  # Once you've seen real per-run cost and behavior, uncomment to automate
  # (example: twice a week, Mon/Thu 07:00 UTC):
  # schedule:
  #   - cron: '0 7 * * 1,4'

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Pinned to the last commit confirmed working (PR #74, 2026-09-04:
      # SHA ef8bb1e, claude-agent-sdk@0.3.260, Claude Code v2.1.260).
      # The floating @v1 tag moved to SHA 9c5ddab2 sometime before
      # 2026-09-07 (claude-agent-sdk@0.3.263, Claude Code v2.1.263) and
      # both runs on that new version failed with subtype:"success" +
      # is_error:true — once after 19 real turns, once instantly at
      # turn 1 / $0 cost, before any model call completed. That's not
      # something our prompt or AGENTS.md caused. Re-float back to @v1
      # once a newer version is confirmed working again.
      - uses: anthropics/claude-code-action@ef8bb1e43bf303cff727a1dd0b8837029fe982a2
        env:
          YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            ${{ inputs.instruction != '' && format('Конкретное поручение от человека на этот прогон: {0}. Выполни именно это, если это осмысленно и безопасно (по правилам из AGENTS.md, включая «Радиус поражения») — это приоритет №1 для этого прогона, не занимайся вместо этого самостоятельным анализом. Если поручение неясно или противоречит правилам безопасности — сделай ближайшее осмысленное и безопасное, и обязательно объясни в PR и в Telegram, что именно и почему сделал иначе, чем попросили.', inputs.instruction) || '' }}
            Ты работаешь с этим репозиторием как автономный агент,
            отвечающий за рост органического трафика и качество блога
            podbor-oborudovaniya.ru. Полный контекст, схема контента,
            известный техдолг и правила работы — в AGENTS.md в корне
            репозитория. Прочитай его первым делом, это обязательно.

            Сначала посмотри реальные данные — сводку и популярные запросы
            из Яндекс.Вебмастера, статистику по URL из Яндекс.Метрики (обе
            описаны в AGENTS.md). Реши, что сейчас наиболее ценно на основе
            этих данных, а не только по содержимому репозитория: новая
            статья на тему-пробел, исправление технической/SEO-проблемы,
            доработка существующей статьи (например, title/description у
            статьи с показами, но низким CTR). В описании PR объясни, что
            ты увидел в данных и почему выбрал именно это действие.

            Работай по процессу из AGENTS.md: отдельная ветка, обязательный
            npm run build перед мержем, один PR за прогон, смердж через
            gh CLI (squash) сам — но только если сборка зелёная. Если не
            получилось добиться зелёной сборки — оставь PR открытым и
            опиши проблему, не мержи.
          claude_args: |
            --model claude-sonnet-5
            --max-turns 65
            --max-budget-usd 1.50
            --effort medium
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"

      # Safety net: fires only if the agent step itself failed/crashed before
      # it could send its own Telegram summary, so silence never means "all good".
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            --data-urlencode text="⚠️ Прогон growth-agent упал до того, как агент успел отчитаться. Смотри лог: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
