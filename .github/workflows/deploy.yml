name: Deploy podbor-oborudovaniya

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          RELEASE_DIR=/var/www/podbor-oborudovaniya/releases/$TIMESTAMP
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "mkdir -p $RELEASE_DIR"
          rsync -avz --delete -e "ssh -i ~/.ssh/id_ed25519" ./out/ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$RELEASE_DIR/
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
            ln -sfn $RELEASE_DIR /var/www/podbor-oborudovaniya/current &&
            cd /var/www/podbor-oborudovaniya/releases && ls -t | tail -n +6 | xargs -r rm -rf
          "

      # Best-effort ping to IndexNow with the current sitemap, so search
      # engines learn about new/changed pages right after deploy, without
      # waiting for the next crawl or a manual Webmaster recrawl push.
      # Never fails the deploy job — indexing pings are non-critical.
      #
      # Yandex's own IndexNow docs (yandex.ru/support/webmaster/ru/indexnow)
      # specify their own endpoint (yandex.com/indexnow) and don't mention
      # the generic api.indexnow.org aggregator — so we hit Yandex directly
      # to be sure it actually lands there, plus the generic aggregator as a
      # bonus for Bing/other participants (cheap, non-critical either way).
      - name: Ping IndexNow with current sitemap URLs
        continue-on-error: true
        run: |
          KEY="924f005ad5c31176b5881dd6ac6adf5d"
          HOST="podbor-oborudovaniya.ru"
          URLS=$(grep -oP '(?<=<loc>)[^<]+' out/sitemap.xml | sed 's/.*/"&"/' | paste -sd, - || true)
          if [ -n "$URLS" ]; then
            BODY="{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":[$URLS]}"
            curl -s --max-time 10 -X POST "https://yandex.com/indexnow" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "$BODY" || true
            curl -s --max-time 10 -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "$BODY" || true
          fi
